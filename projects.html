<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Expo FITers GP – Projects</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,700;1,900&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --maroon: #6b1a2a; --maroon-mid: #4a1020; --red: #c31e2d;
      --bg: #0a0608; --border: rgba(255,255,255,.08); --text: #ffffff;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; }

    /* LOGO PILL STYLING - TRANSPARENT */
    .brand-container { height: 72px; display: flex; align-items: center; background: transparent; padding: 4px; }
    .brand-container img { height: 100%; width: auto; max-height: 64px; object-fit: contain; }
    .partner-container { height: 56px; display: flex; align-items: center; gap: 20px; border-left: 1px solid var(--border); padding-left: 24px; }
    .partner-container img { height: 100%; width: auto; max-height: 56px; object-fit: contain; }

    /* REMAINDER OF CSS REMAINS IDENTICAL TO YOUR LAST WORKING VERSION */
    .nav { flex-shrink: 0; padding: 1.25rem 2rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: rgba(10,6,8,0.4); backdrop-filter: blur(8px); }
    .nav-left { display: flex; gap: 24px; align-items: center; }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .nav-judge { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text); letter-spacing: 0.05em; text-transform: uppercase; }
    .nav-progress { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--sub); background: rgba(255,255,255,0.04); padding: 5px 14px; border-radius: 6px; border: 1px solid var(--border); letter-spacing: 0.04em; }

   .controls-row { flex-shrink: 0; padding: 1.25rem 2rem; display: flex; flex-direction: column; gap: 1.25rem; border-bottom: 1px solid var(--border); background: rgba(10,6,8,0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); z-index: 15; }

    .search-bar { width: 100%; max-width: 460px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 8px; padding: 12px 18px; color: #fff; font-family: 'Inter', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s, background-color 0.2s; }

    .search-bar:focus { border-color: var(--maroon); background: rgba(255,255,255,0.07); }

    .search-bar::placeholder { color: var(--muted); }

    

    .category-slider { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }

    .category-slider::-webkit-scrollbar { display: none; }

    .cat-pill { padding: 8px 20px; border-radius: 100px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.02); color: var(--sub); font-size: 11px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.06em; font-family: 'IBM Plex Mono', monospace; }

    .cat-pill:hover { background: rgba(255,255,255,0.08); color: #fff; border-color: rgba(255,255,255,0.2); }

    .cat-pill.active { background: var(--maroon); border-color: var(--red); color: #fff; box-shadow: 0 0 16px rgba(107,26,42,0.6); }



    .stage { flex: 1; position: relative; overflow: hidden; width: 100%; display: flex; flex-direction: column; }

    .cards-track { flex: 1; display: flex; align-items: center; gap: 3rem; padding: 2rem 0; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; -webkit-overflow-scrolling: touch; }

    .cards-track:after { content: ''; flex-shrink: 0; width: calc(50vw - 170px); }

    .cards-track::-webkit-scrollbar { display: none; }



    .proj-card { scroll-snap-align: center; flex-shrink: 0; width: clamp(290px, 82vw, 350px); height: clamp(400px, 62vh, 500px); border-radius: 18px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,.1); cursor: pointer; box-shadow: 0 25px 60px rgba(0,0,0,.65); transition: transform 0.25s cubic-bezier(.22,1,.36,1), border-color 0.2s; }

    .proj-card:hover { transform: translateY(-6px); border-color: rgba(255,255,255,.25); }

    

    .proj-card-bg { position: absolute; inset: 0; }

    .proj-card-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,6,8,.98) 0%, rgba(10,6,8,.4) 50%, rgba(10,6,8,.05) 100%); }

    .proj-card-content { position: absolute; bottom: 0; left: 0; right: 0; padding: 1.75rem; display: flex; flex-direction: column; }



    .proj-card-tag { display: inline-flex; align-items: center; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); border-radius: 100px; padding: 4px 12px; font-size: 9px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.7); margin-bottom: 12px; width: fit-content; }

    .proj-card-num { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: rgba(255,255,255,.35); margin-bottom: 4px; letter-spacing: .06em; }

    .proj-card-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; line-height: 1.05; letter-spacing: .02em; text-transform: uppercase; color: #fff; font-size: clamp(1.7rem, 3vw, 2.4rem); margin-bottom: 8px; }

    .proj-card-members { font-size: 12px; color: rgba(255,255,255,.45); line-height: 1.5; margin-bottom: 16px; }



    .card-eval-btn { width: 100%; height: 46px; border: none; border-radius: 8px; background: var(--maroon); color: #fff; font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background .2s, transform .2s; }

    .card-eval-btn:hover { background: var(--maroon-mid); }

    .card-eval-btn:active { transform: scale(0.98); }



    .voted-badge { margin-top: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #fff; text-align: center; background: rgba(107,26,42,0.6); border: 1px solid rgba(195,30,45,0.6); padding: 8px; border-radius: 6px; font-weight: 500; }



    .dots { position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; }

    .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.2); transition: background .3s, transform .3s; cursor: pointer; }

    .dot.active { background: #fff; transform: scale(1.3); }



    .marquee-wrap { flex-shrink: 0; border-top: 1px solid var(--border); overflow: hidden; height: 36px; display: flex; align-items: center; background: rgba(10,6,8,0.8); }

    .marquee-track { display: flex; white-space: nowrap; animation: marquee 20s linear infinite; width: max-content; }

    .marquee-item { display: inline-flex; align-items: center; gap: 14px; padding: 0 28px; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

    .marquee-sep { width: 4px; height: 4px; border-radius: 50%; background: var(--maroon); flex-shrink: 0; }

    .marquee-item.hi { color: rgba(255,255,255,.6); }

    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }



    .expanded-overlay { display: none; position: fixed; inset: 0; z-index: 50; background: rgba(10,6,8,.9); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); overflow-y: auto; padding: 2rem 1.5rem; }

    .expanded-overlay.visible { display: block; animation: overlay-in .3s cubic-bezier(.22,1,.36,1) both; }

    @keyframes overlay-in { from { opacity:0; } to { opacity:1; } }



    .expanded-inner { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; animation: slide-up .4s cubic-bezier(.22,1,.36,1) both; }

    @keyframes slide-up { from { transform: translateY(40px); opacity:0; } to { transform: translateY(0); opacity:1; } }



    .back-btn { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; font-size: 13px; font-family: 'Inter', sans-serif; padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: all .15s; width: fit-content; }

    .back-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,.3); }



    .exp-hero { border-radius: 16px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,.1); height: clamp(200px, 30vh, 280px); }

    .exp-hero-bg { position: absolute; inset: 0; }

    .exp-hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,6,8,.98) 0%, rgba(10,6,8,.35) 60%, transparent 100%); }

    .exp-hero-content { position: absolute; bottom: 0; left: 0; right: 0; padding: 1.75rem; }



    .exp-tag { display: inline-flex; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15); border-radius: 100px; padding: 4px 14px; font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.8); margin-bottom: 10px; }

    .exp-num { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: rgba(255,255,255,.4); margin-bottom: 4px; }

    .exp-name { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(2rem,5vw,3rem); font-weight: 900; text-transform: uppercase; letter-spacing: .02em; line-height: 1; color: #fff; }



    .info-card { background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 16px; padding: 1.75rem; display: flex; flex-direction: column; gap: 1.5rem; }

    .info-section-title { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--sub); margin-bottom: 8px; }

    .info-abstract { font-size: 14px; color: rgba(255,255,255,0.85); line-height: 1.75; }

    .info-divider { height: 1px; background: var(--border); }

    .info-meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }

    .info-meta-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--sub); margin-bottom: 6px; font-family: 'IBM Plex Mono', monospace; }

    .info-meta-value { font-size: 14px; color: var(--text); font-weight: 500; }



    .members-list { display: flex; flex-direction: column; gap: 6px; }

    .member-item { display: flex; align-items: center; gap: 10px; font-size: 14px; color: rgba(255,255,255,0.85); }

    .member-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--maroon); flex-shrink: 0; }



    .rating-card { background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }

    .rating-card-top { height: 4px; background: linear-gradient(90deg, var(--maroon), var(--red)); }

    .rating-card-inner { padding: 1.75rem; display: flex; flex-direction: column; gap: 1.75rem; }

    .rating-title { font-family: 'Barlow Condensed', sans-serif; font-size: 1.6rem; font-weight: 900; text-transform: uppercase; letter-spacing: .04em; color: #fff; }

    .rating-sub { font-size: 13px; color: var(--sub); margin-top: 4px; }



    .criteria-list { display: flex; flex-direction: column; gap: 1.75rem; }

    .criterion-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }

    .criterion-name { font-size: 14px; font-weight: 500; color: #fff; }

    .criterion-score-display { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #fff; font-weight: 500; }



    .range-label { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 8px; font-style: italic; }

    .range-hint { display: flex; justify-content: space-between; margin-top: 6px; }

    .range-hint span { font-size: 11px; color: var(--sub); font-family: 'IBM Plex Mono', monospace; }



    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); outline: none; cursor: pointer; }

    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(107,26,42,.4), 0 2px 10px rgba(0,0,0,.5); cursor: pointer; transition: transform .15s; }

    input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); }

    input[type=range]:disabled { opacity: .4; cursor: not-allowed; }



    .rating-divider { height: 1px; background: var(--border); }

    .overall-wrap { display: flex; flex-direction: column; gap: 12px; }

    .overall-display { text-align: center; padding: 1.5rem 0 .5rem; }

    .overall-num { font-family: 'Barlow Condensed', sans-serif; font-size: 6rem; font-weight: 900; line-height: 1; background: linear-gradient(135deg, #fff 30%, rgba(255,255,255,.4) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

    .overall-outof { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin-top: 4px; }



    .btn-submit { width: 100%; height: 56px; border: none; border-radius: 12px; background: var(--maroon); color: #fff; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all .2s; box-shadow: 0 6px 24px rgba(107,26,42,.5); }

    .btn-submit:hover { background: var(--red); transform: translateY(-2px); }

    .btn-submit:active { transform: scale(.98); }

    .btn-submit:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }

    .submit-note { font-size: 12px; color: var(--sub); text-align: center; margin-top: 8px; }



    .locked-state { display: none; flex-direction: column; align-items: center; gap: 1.25rem; padding: 3rem 2rem; text-align: center; }

    .locked-state.visible { display: flex; }

    .locked-icon { width: 72px; height: 72px; border-radius: 50%; background: rgba(107,26,42,.3); border: 1px solid rgba(195,30,45,.5); display: flex; align-items: center; justify-content: center; animation: pop .5s cubic-bezier(.22,1,.36,1) both; }

    @keyframes pop { from { transform: scale(.5); opacity:0; } to { transform: scale(1); opacity:1; } }

    .locked-title { font-family: 'Barlow Condensed', sans-serif; font-size: 2.2rem; font-weight: 900; text-transform: uppercase; color: #fff; }

    .locked-sub { font-size: 15px; color: var(--sub); }

    .locked-score-badge { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: #fff; background: rgba(107,26,42,.4); border: 1px solid rgba(195,30,45,.4); border-radius: 8px; padding: 12px 24px; margin-top: 10px; }



    .confetti-piece { position: fixed; border-radius: 2px; pointer-events: none; z-index: 1000; animation: confetti-fall linear forwards; }

    @keyframes confetti-fall { 0% { transform: translateY(-20px) rotate(0deg); opacity:1; } 100% { transform: translateY(100vh) rotate(720deg); opacity:0; } }



    .error-toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: #3a0a0a; border: 1px solid var(--red); color: #fff; font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 12px 20px; border-radius: 8px; z-index: 200; display: none; }

    .error-toast.visible { display: block; animation: fade-up .3s ease both; }

    @keyframes fade-up { from { opacity:0; transform: translateX(-50%) translateY(10px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }



    @media (max-width: 900px) {

      .nav { padding: 1rem; justify-content: center; flex-direction: column; gap: 14px; height: auto; }

      .nav-left { flex-direction: column; gap: 12px; width: 100%; align-items: center; }

      .partner-container { border-left: none; padding-left: 0; gap: 16px; height: auto; flex-wrap: wrap; justify-content: center; }

      .partner-container img { max-height: 48px; height: 48px; }

      .brand-container { height: 72px; padding: 8px 20px; }

      .brand-container img { max-height: 56px; }

      .nav-right { width: 100%; justify-content: space-between; }

      .cards-track { padding: 2rem calc(50vw - 150px); }

      .controls-row { padding: 1rem; align-items: center; }

      .search-bar { max-width: 100%; }

      .info-meta-grid { grid-template-columns: 1fr; }

    }
  </style>
</head>
<body>
<script>
  // Configuration
  const SUPABASE_URL = 'YOUR_URL';
  const SUPABASE_KEY = 'YOUR_KEY';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Authentication Check
  (async function checkAuth() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) window.location.replace('login.html');
    window.ACTIVE_USER_EMAIL = session.user.email;
    document.getElementById('judge-id-display').textContent = session.user.email.split('@')[0].toUpperCase();
  })();

  // Updated Submission Logic
  async function submitVote() {
    const btn = document.getElementById('submit-btn-element');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    const { error } = await supabase
      .from('evaluations')
      .insert([{
        judge_email:   window.ACTIVE_USER_EMAIL,
        project_num:   currentProject.num,
        criterion_1:   criteriaValues['c1'],
        criterion_2:   criteriaValues['c2'],
        criterion_3:   criteriaValues['c3'],
        overall_score: overallValue
      }]);

    if (error) {
      alert("Error: " + error.message);
      btn.disabled = false;
      btn.textContent = 'Submit Evaluation';
    } else {
      finalizeSubmissionUI();
    }
  }
</script>
</body>
</html>
