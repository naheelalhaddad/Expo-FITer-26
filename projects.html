    }

      cursor: pointer; transition: transform .15s;
    }

      width: 24px; height: 24px; border-radius: 50%; background: #fff;
      box-shadow: 0 0 0 4px rgba(107,26,42,.4), 0 2px 10px rgba(0,0,0,.5);
      cursor: pointer; transition: transform .15s;
    }
    /* Track styles for range */
    input[type=range] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 3px;
      background: rgba(255,255,255,.1); outline: none; cursor: pointer;

    input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,.1);}
    input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,.1);}
    input[type=range]::-ms-fill-lower,
    input[type=range]::-ms-fill-upper { background: rgba(255,255,255,.1);}
    input[type=range]:focus { outline: none; }
    /* Remove focus outline in Firefox */
    input[type=range]::-moz-focus-outer { border: 0; }
        .bg-video { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 0; filter: blur(10px); opacity: 0.65; pointer-events: none; transform: scale(1.05); }

    .card-eval-btn { width: 100%; height: 46px; border: none; border-radius: 8px; background: var(--maroon); color: #fff; font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background .2s, transform .2s; }
    .card-eval-btn:hover { background: var(--maroon-mid); }

    .voted-badge { margin-top: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #fff; text-align: center; background: rgba(107,26,42,0.6); border: 1px solid rgba(195,30,45,0.6); padding: 8px; border-radius: 6px; font-weight: 500; }

    .dots { position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; }

    .dot.active { background: #fff; transform: scale(1.3); }

    .marquee-wrap { flex-shrink: 0; border-top: 1px solid var(--border); overflow: hidden; height: 36px; display: flex; align-items: center; background: rgba(10,6,8,0.8); }
    .marquee-track { display: flex; white-space: nowrap; animation: marquee 20s linear infinite; width: max-content; }

    .marquee-sep { width: 4px; height: 4px; border-radius: 50%; background: var(--maroon); flex-shrink: 0; }

    .expanded-overlay { display: none; position: fixed; inset: 0; z-index: 50; background: rgba(10,6,8,.9); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); overflow-y: auto; padding: 2rem 1.5rem; }
    .expanded-overlay.visible { display: block; animation: overlay-in .3s cubic-bezier(.22,1,.36,1) both; }
    @keyframes overlay-in { from { opacity:0; } to { opacity:1; } }

    .expanded-inner { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; animation: slide-up .4s cubic-bezier(.22,1,.36,1) both; }

    .info-card { background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 16px; padding: 1.75rem; display: flex; flex-direction: column; gap: 1.5rem; }

    <div class="rating-card">
      <div class="rating-card-top"></div>
      <div class="rating-card-inner">
        <div>
          <div class="rating-title">Evaluate Project</div>
          <div class="rating-sub">[Criteria descriptions will be added once the rubric is finalized]</div>
        </div>
        <div class="criteria-list" id="criteria-list"></div>
        <div class="rating-divider"></div>
        <div class="overall-wrap">
          <div class="info-section-title">Overall Score</div>
          <div class="overall-display">
            <div class="overall-num" id="overall-num">75</div>
            <div class="overall-outof">out of 100</div>
          </div>
          <input type="range" id="overall-slider" min="0" max="100" value="75" oninput="updateOverall(this.value)" />
          <div class="range-hint">
            <span>0</span><span>50</span><span>100</span>
          </div>
          <div class="range-label" id="overall-range-label">Good — Solid project with minor areas for improvement</div>
        </div>
        <div class="rating-divider"></div>
        <div id="voting-ui">
        <button class="btn-submit" onclick="submitVoteToSupabase()" id="submit-btn-element">
            Submit Evaluation
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 5l4 3-4 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="submit-note">Scores cannot be altered once transmitted to the database.</div>
        </div>
        <div class="locked-state" id="locked-state">
          <div class="locked-icon">
            <svg width="26" height="26" viewBox="0 0 26 26" fill="none"><path d="M7 11V8a6 6 0 0112 0v3" stroke="#fff" stroke-width="2" stroke-linecap="round"/><rect x="3" y="11" width="20" height="12" rx="2.5" stroke="#fff" stroke-width="2"/><circle cx="13" cy="18" r="2" fill="#fff"/></svg>
          </div>
          <div class="locked-title">Transmission Successful</div>
          <div class="locked-sub">Evaluation data stored securely.</div>
          <div class="locked-score-badge" id="locked-score-text"></div>
        </div>
      </div>
    </div>
    <div style="height:2rem"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://bpddzqbuqdmvubuzerem.supabase.co';
const SUPABASE_KEY = 'sb_publishable_76CrGMLLkhNRoTaJy1xEWg_kbp5DSxm';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentProject = null;
let overallValue = 75;
let criteriaValues = {};
let activeCategory = 'All';

const categories = ["[Category 1]", "[Category 2]", "[Category 3]", "[Category 4]", "[Category 5]"];
const projects = [
  { num:'P-001', name:'[Project Name 1]', category:'[Category 1]', supervisor:'[Supervisor Name]', members:['[Member 1]','[Member 2]','[Member 3]'], abstract:'[Project abstract]', colors:['#6b1a2a','#300a12'], voted: false },
  { num:'P-002', name:'[Project Name 2]', category:'[Category 2]', supervisor:'[Supervisor Name]', members:['[Member 1]','[Member 2]','[Member 3]'], abstract:'[Project abstract]', colors:['#4a1020','#1f040b'], voted: false },
  { num:'P-003', name:'[Project Name 3]', category:'[Category 3]', supervisor:'[Supervisor Name]', members:['[Member 1]','[Member 2]','[Member 3]'], abstract:'[Project abstract]', colors:['#8a2236','#400c19'], voted: false },
  { num:'P-004', name:'[Project Name 4]', category:'[Category 4]', supervisor:'[Supervisor Name]', members:['[Member 1]','[Member 2]','[Member 3]'], abstract:'[Project abstract]', colors:['#5c1422','#29070e'], voted: false },
  { num:'P-005', name:'[Project Name 5]', category:'[Category 5]', supervisor:'[Supervisor Name]', members:['[Member 1]','[Member 2]','[Member 3]'], abstract:'[Project abstract]', colors:['#7a1c2e','#380914'], voted: false }
];

const criteria = [{ name:'[Criterion 1]', key:'c1' }, { name:'[Criterion 2]', key:'c2' }, { name:'[Criterion 3]', key:'c3' }];
const rangeLabels = [
  { max:20,  label:'Poor — Does not meet basic requirements' },
  { max:40,  label:'Below Average — Significant gaps in execution' },
  { max:60,  label:'Average — Meets some requirements with notable gaps' },
  { max:75,  label:'Good — Solid project with minor areas for improvement' },
  { max:90,  label:'Very Good — Exceeds expectations in most areas' },
  { max:100, label:'Excellent — Outstanding, exceptional quality' }
];

(async function initApp() {
  const { data: { session }, error } = await supabase.auth.getSession();
  
  window.ACTIVE_USER_EMAIL = session ? session.user.email : 'test_judge@asu.edu.jo';
  document.getElementById('judge-id-display').textContent = window.ACTIVE_USER_EMAIL.split('@')[0].toUpperCase();

  initCategories();
  renderCards(projects);
  updateProgress();
  lockPastEvaluations();

  const video = document.getElementById('bg-video-stream');
  if (video) video.playbackRate = 0.5;
})();

async function submitVoteToSupabase() {
  const btn = document.getElementById('submit-btn-element');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  const { error } = await supabase.from('evaluations').insert([{
      judge_email:   window.ACTIVE_USER_EMAIL,
      project_num:   currentProject.num,
      criterion_1:   criteriaValues['c1'] || 75,
      criterion_2:   criteriaValues['c2'] || 75,
      criterion_3:   criteriaValues['c3'] || 75,
      overall_score: overallValue
  }]);

  if (error) {
    if (error.code === '23505') alert("Already evaluated this project!");
    else alert("Error: " + error.message);
    btn.disabled = false;
    btn.textContent = 'Submit Evaluation';
  } else {
    finalizeSubmissionUI();
  }
}

async function lockPastEvaluations() {
  const { data, error } = await supabase.from('evaluations').select('project_num').eq('judge_email', window.ACTIVE_USER_EMAIL);
  if (!error && data) {
    data.forEach(row => {
      const idx = projects.findIndex(p => p.num === row.project_num);
      if (idx !== -1) projects[idx].voted = true;
    });
  }
  filterProjects();
  updateProgress();
}

function getRangeLabel(val) { return rangeLabels.find(r => val <= r.max)?.label || rangeLabels[rangeLabels.length-1].label; }
function updateProgress() { document.getElementById('nav-progress').textContent = `${projects.filter(p => p.voted).length} / ${projects.length} EVALUATED`; }

function initCategories() {
  const catContainer = document.getElementById('category-slider');
  catContainer.innerHTML = `<div class="cat-pill active" onclick="setCategory('All', this)">All Categories</div>` + categories.map(c => `<div class="cat-pill" onclick="setCategory('${c}', this)">${c}</div>`).join('');
}

function setCategory(cat, el) {
  activeCategory = cat;
  document.querySelectorAll('.cat-pill').forEach(pill => pill.classList.remove('active'));
  el.classList.add('active');
  filterProjects();
}

function filterProjects() {
  const query = document.getElementById('search-input').value.toLowerCase();
  renderCards(projects.filter(p => (activeCategory === 'All' || p.category === activeCategory) && (p.name.toLowerCase().includes(query) || p.num.toLowerCase().includes(query))));
}

function renderCards(dataSet) {
  const trackElement = document.getElementById('cards-track');
  const offsetCalc = (window.innerWidth / 2) - 175;
  trackElement.style.paddingLeft = `${Math.max(32, offsetCalc)}px`;
  trackElement.style.paddingRight = `${Math.max(32, offsetCalc)}px`;

  if (dataSet.length === 0) {
    trackElement.innerHTML = `<div style="color:var(--sub); padding:4rem; font-family:'IBM Plex Mono'; text-align:center;">No projects found.</div>`;
    buildDots(0);
    return;
  }

  trackElement.innerHTML = dataSet.map(p => {
    const globalIdx = projects.findIndex(orig => orig.num === p.num);
    return `<div class="proj-card" onclick="openEval(${globalIdx})">
      <div class="proj-card-bg" style="background:linear-gradient(135deg,${p.colors[0]} 0%,${p.colors[1]} 100%)"></div>
      <div class="proj-card-overlay"></div>
      <div class="proj-card-content">
        <div class="proj-card-tag">${p.category}</div>
        <div class="proj-card-num">${p.num}</div>
        <div class="proj-card-name">${p.name}</div>
        <div class="proj-card-members">${p.members.slice(0,3).join(' · ')}</div>
        <button class="card-eval-btn">Evaluate Project</button>
        ${p.voted ? `<div class="voted-badge" style="display:block">✓ Evaluation Transmitted</div>` : ''}
      </div>
    </div>`;
  }).join('');
  buildDots(dataSet.length);
}

function buildDots(count) { document.getElementById('dots').innerHTML = Array.from({length: count}, (_, i) => `<div class="dot ${i===0?'active':''}" onclick="scrollToCard(${i})"></div>`).join(''); }
function scrollToCard(index) { const track = document.getElementById('cards-track'); if(track.children[index]) track.children[index].scrollIntoView({ behavior: 'smooth', inline: 'center' }); }

document.getElementById('cards-track').addEventListener('scroll', () => {
  const track = document.getElementById('cards-track');
  if(!track.children.length) return;
  const center = track.scrollLeft + (track.offsetWidth / 2);
  let closestIndex = 0, minDistance = Infinity;
  [...track.children].forEach((card, i) => {
    const dist = Math.abs(card.offsetLeft + (card.offsetWidth / 2) - center);
    if(dist < minDistance) { minDistance = dist; closestIndex = i; }
  });
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === closestIndex));
});

function openEval(idx) {
  currentProject = projects[idx];
  overallValue = 75;
  criteria.forEach(c => criteriaValues[c.key] = 75);
  const p = currentProject;
  document.getElementById('exp-hero-bg').style.background = `linear-gradient(135deg,${p.colors[0]} 0%,${p.colors[1]} 100%)`;
  document.getElementById('exp-tag').textContent = p.category;
  document.getElementById('exp-num').textContent = p.num;
  document.getElementById('exp-name').textContent = p.name;
  document.getElementById('exp-abstract').textContent = p.abstract;
  document.getElementById('exp-supervisor').textContent = p.supervisor;
  document.getElementById('exp-category').textContent = p.category;
  document.getElementById('exp-members').innerHTML = p.members.map(m => `<div class="member-item"><div class="member-dot"></div>${m}</div>`).join('');
  document.getElementById('criteria-list').innerHTML = criteria.map(c => `<div class="criterion"><div class="criterion-header"><span class="criterion-name">${c.name}</span><span class="criterion-score-display" id="score-${c.key}">75 / 100</span></div><input type="range" min="0" max="100" value="75" oninput="updateCriterion('${c.key}', this.value)" ${p.voted ? 'disabled' : ''}/><div class="range-hint"><span>0</span><span>50</span><span>100</span></div><div class="range-label" id="label-${c.key}">${getRangeLabel(75)}</div></div>`).join('');
  document.getElementById('overall-num').textContent = p.voted ? 'LOCKED' : 75;
  document.getElementById('overall-slider').value = 75;
  document.getElementById('overall-slider').disabled = p.voted;
  document.getElementById('overall-range-label').textContent = getRangeLabel(75);
  document.getElementById('voting-ui').style.display = p.voted ? 'none' : 'block';
  const lockedState = document.getElementById('locked-state');
  p.voted ? lockedState.classList.add('visible') : lockedState.classList.remove('visible');
  if(p.voted) document.getElementById('locked-score-text').textContent = "Locked in Database";
  const ov = document.getElementById('expanded-overlay');
  ov.classList.add('visible');
  ov.scrollTop = 0;
}

function closeExpanded() { document.getElementById('expanded-overlay').classList.remove('visible'); }

function updateCriterion(key, val) {
  criteriaValues[key] = parseInt(val);
  document.getElementById(`score-${key}`).textContent = `${val} / 100`;
  document.getElementById(`label-${key}`).textContent = getRangeLabel(parseInt(val));
}

function updateOverall(val) {
  overallValue = parseInt(val);
  document.getElementById('overall-num').textContent = val;
  document.getElementById('overall-range-label').textContent = getRangeLabel(parseInt(val));
}

function finalizeSubmissionUI() {
  const idx = projects.indexOf(currentProject);
  if (idx !== -1) projects[idx].voted = true;
  document.getElementById('voting-ui').style.display = 'none';
  document.getElementById('locked-score-text').textContent = `Overall Score: ${overallValue} / 100`;
  document.getElementById('locked-state').classList.add('visible');
  updateProgress();
  filterProjects();
  confetti();
}

function confetti() {
  const colors = ['#6b1a2a','#4a1020','#ffffff','#c31e2d'];
  for (let i = 0; i < 60; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'confetti-piece';
      const size = 5 + Math.random() * 8;
      c.style.cssText = `position:fixed;z-index:1000;left:${15+Math.random()*70}%;top:30%;width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};animation:confetti-fall ${1.5+Math.random()*2}s cubic-bezier(.33,.66,.66,1) forwards;`;
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4000);
    }, i * 25);
  }
}

window.addEventListener('resize', filterProjects);
</script>
</body>
</html>
