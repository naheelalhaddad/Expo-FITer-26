<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Expo FITers GP – Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,700;1,900&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<video id="bg-video-stream" class="bg-video" autoplay loop muted playsinline>
  <source src="background.mp4" type="video/mp4" />
</video>
<div class="bg-layer"></div>
<div class="grid-overlay"></div>

<div class="page">
  <div class="nav">
   <div class="nav-left">
      <div class="brand-container">
        <img src="ExpoFITers_WhiteLogo.png" alt="Expo FITers GP" />
      </div>
      <div class="partner-container">
        <img src="ASU_logo_white.png" alt="ASU" />
        <img src="FITer_white_logo.png" alt="FIT" />
      </div>
    </div>
    <div class="nav-right">
      ADMIN_PANEL
    </div>
  </div>

  <div class="dashboard-container">
    <div class="main-panel">
      <div class="tabs" id="category-tabs"></div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>[NEW RANK NAME]</th>
              <th>[NEW LEAD NAME]</th>
              <th>[NEW TEAM ID NAME]</th>
              <th>[NEW TRACK NAME]</th>
              <th>[NEW SCORE NAME]</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </div>
    </div>

    <div class="side-panel">
      <div class="champion-card">
        <div class="champion-header" id="champion-category-label">Overall Ranking<br>Grand Champion</div>
        <div class="champion-badge">#1</div>
        <div class="champion-name" id="champ-name">Awaiting Data</div>
        <div class="champion-project" id="champ-project">...</div>
        <div class="runner-ups" id="runner-ups-list"></div>
      </div>
    </div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
