<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Expo FITer 26</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,700;1,900&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:     #2d4b87;
      --blue-mid: #3c5a9e;
      --red:      #c31e2d;
      --bg:       #060d1a;
      --border:   rgba(255,255,255,.08);
      --text:     #ffffff;
      --sub:      rgba(255,255,255,.45);
      --muted:    rgba(255,255,255,.2);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    /* ── BG ── */
    .bg-layer {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse 80% 60% at 20% 50%, rgba(45,75,135,.35) 0%, transparent 60%),
                  radial-gradient(ellipse 60% 50% at 80% 60%, rgba(195,30,45,.25) 0%, transparent 60%);
    }
    .grid-overlay {
      position: fixed; inset: 0; z-index: 1;
      background-image: linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px), linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
      background-size: 56px 56px;
    }
    .noise {
      position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: .04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    /* ── PAGE ── */
    .page { position: relative; z-index: 10; height: 100vh; display: flex; flex-direction: column; }

    /* ── TOP NAV ── */
    .nav {
      flex-shrink: 0;
      padding: 1.25rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.1rem; font-weight: 900;
      letter-spacing: .08em; text-transform: uppercase;
      color: #fff;
      border: 1.5px solid rgba(255,255,255,.2);
      padding: 5px 14px; border-radius: 4px;
    }
    .nav-right { display: flex; align-items: center; gap: 8px; }
    .nav-tag {
      font-size: 10px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase;
      padding: 4px 12px; border-radius: 100px;
      border: 1px solid rgba(195,30,45,.35);
      color: rgba(195,30,45,.9);
      background: rgba(195,30,45,.08);
      display: flex; align-items: center; gap: 6px;
    }
    .nav-tag-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

    /* ── CAROUSEL ── */
    .carousel-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: grab;
      display: flex; flex-direction: column; justify-content: center;
    }
    .carousel-wrap.grabbing { cursor: grabbing; }

    .carousel-track {
      display: flex;
      gap: 16px;
      padding: 0 2rem;
      user-select: none;
      will-change: transform;
      transition: transform .05s linear;
    }

    /* PROJECT CARD */
    .proj-card {
      flex-shrink: 0;
      width: clamp(260px, 32vw, 380px);
      height: clamp(340px, 55vh, 480px);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255,255,255,.07);
      transition: transform .3s cubic-bezier(.22,1,.36,1);
    }

    .proj-card:hover { transform: scale(1.02) translateY(-4px); }

    /* gradient backgrounds as placeholders */
    .proj-card-bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
    }

    .proj-card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(6,13,26,.95) 0%, rgba(6,13,26,.3) 50%, rgba(6,13,26,.1) 100%);
    }

    .proj-card-content {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 1.5rem;
    }

    .proj-card-tag {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 100px;
      padding: 3px 10px;
      font-size: 10px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
      color: rgba(255,255,255,.7);
      margin-bottom: 10px;
    }

    .proj-card-num {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px; color: rgba(255,255,255,.3);
      margin-bottom: 4px; letter-spacing: .06em;
    }

    .proj-card-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(1.6rem, 3.5vw, 2.2rem);
      font-weight: 900;
      line-height: 1.0;
      letter-spacing: .02em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 8px;
    }

    .proj-card-members {
      font-size: 11px; color: rgba(255,255,255,.45);
      line-height: 1.5;
    }

    /* drag hint */
    .drag-hint {
      position: absolute; bottom: 1.5rem; right: 2rem;
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--muted); letter-spacing: .04em;
      animation: fade-hint 3s ease-in-out 1.5s forwards;
      opacity: 0;
    }
    @keyframes fade-hint { 0% { opacity:0; } 20% { opacity:1; } 80% { opacity:1; } 100% { opacity:0; } }

    /* ── MARQUEE ── */
    .marquee-wrap {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      overflow: hidden;
      height: 36px; display: flex; align-items: center;
    }
    .marquee-track {
      display: flex; white-space: nowrap;
      animation: marquee 22s linear infinite;
      width: max-content;
    }
    .marquee-item {
      display: inline-flex; align-items: center; gap: 14px;
      padding: 0 28px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted);
    }
    .marquee-sep { width: 4px; height: 4px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
    .marquee-item.hi { color: rgba(255,255,255,.5); }
    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* ── MODAL ── */
      .modal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(6,13,26,.3);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
    animation: backdrop-in .4s ease both;
  }
    @keyframes backdrop-in { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      width: 100%; max-width: 380px;
      background: rgba(12,22,42,.92);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 40px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.04);
      animation: modal-in .5s cubic-bezier(.22,1,.36,1) .1s both;
    }
    @keyframes modal-in { from { opacity:0; transform: translateY(32px) scale(.97); } to { opacity:1; transform: translateY(0) scale(1); } }

    .modal-stripe { height: 3px; background: linear-gradient(90deg, var(--blue) 0%, var(--red) 100%); }

    .modal-inner { padding: 2rem 1.75rem 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; }

    .modal-header {}
    .modal-eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
      color: rgba(255,255,255,.3);
      margin-bottom: 6px;
    }
    .modal-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2rem; font-weight: 900; letter-spacing: .04em; text-transform: uppercase;
      color: #fff; line-height: 1;
    }
    .modal-sub { font-size: 12px; color: var(--sub); margin-top: 4px; line-height: 1.5; }

    .divider { height: 1px; background: rgba(255,255,255,.07); }

    .form { display: flex; flex-direction: column; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted);
    }
    input {
      height: 44px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px;
      padding: 0 14px;
      font-size: 14px; font-family: 'Inter', sans-serif;
      color: #fff; outline: none;
      transition: border-color .15s, background .15s, box-shadow .15s;
    }
    input:focus {
      border-color: rgba(45,75,135,.7);
      background: rgba(45,75,135,.1);
      box-shadow: 0 0 0 3px rgba(45,75,135,.2);
    }
    input::placeholder { color: rgba(255,255,255,.2); }

    .btn {
      height: 48px; border: none; border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 17px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all .2s;
      box-shadow: 0 4px 20px rgba(45,75,135,.45);
      margin-top: 4px;
    }
    .btn:hover { background: var(--blue-mid); box-shadow: 0 8px 28px rgba(45,75,135,.55); transform: translateY(-1px); }
    .btn:active { transform: scale(.98); }

    .error-msg {
      font-size: 12px; color: #f0a0a8;
      background: rgba(195,30,45,.1); border: 1px solid rgba(195,30,45,.2);
      border-radius: 6px; padding: 8px 12px;
      display: none;
    }
    .error-msg.visible { display: block; }

    .modal-foot {
      padding: 12px 1.75rem 1.25rem;
      border-top: 1px solid rgba(255,255,255,.06);
      font-size: 11px; color: rgba(255,255,255,.2);
      text-align: center; line-height: 1.6;
    }

    @media (max-height: 640px) {
      .modal-inner { padding: 1.25rem 1.5rem 1rem; gap: .9rem; }
      .modal-title { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<div class="bg-layer"></div>
<div class="grid-overlay"></div>
<div class="noise"></div>

<div class="page">

  <!-- NAV -->
  <div class="nav">
    <div class="nav-logo">Expo FITer 26</div>
    <div class="nav-right">
      <div class="nav-tag">
        <div class="nav-tag-dot"></div>
        Live Evaluation
      </div>
    </div>
  </div>

  <!-- CAROUSEL -->
  <div class="carousel-wrap" id="carousel-wrap">
    <div class="carousel-track" id="carousel-track"></div>
    <div class="drag-hint">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M2 7h4M8 7h4M10 5l2 2-2 2M4 5L2 7l2 2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Drag to explore
    </div>
  </div>

  <!-- MARQUEE -->
  <div class="marquee-wrap">
    <div class="marquee-track" id="marquee-track"></div>
  </div>

</div>

<!-- MODAL -->
<div class="modal-backdrop">
  <div class="modal">
    <div class="modal-stripe"></div>
    <div class="modal-inner">
      <div class="modal-header">
        <div class="modal-eyebrow">Expo FITer 26 · ASU Jordan</div>
        <div class="modal-title">Sign In</div>
        <div class="modal-sub">Enter your credentials to access the evaluation panel.</div>
      </div>

      <div class="divider"></div>

      <div class="form">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="judge_01" autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
        </div>

        <div class="error-msg" id="error-msg">Incorrect username or password.</div>

        <button class="btn" onclick="handleLogin()">
          Enter
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M3 8h10M9 5l4 3-4 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="modal-foot">
      Access restricted to authorized judges and administrators.
    </div>
  </div>
</div>

<script>
  // ── PROJECT DATA (placeholder) ──
  const projects = [
    { num:'P-001', name:'Smart Parking Detection', category:'AI & Vision',    members:'Ahmad K. · Sara M. · Yousef H.',  colors:['#1a3a6e','#0d2547'] },
    { num:'P-002', name:'E-Learning Portal',        category:'Web Systems',   members:'Lina F. · Mohammad R. · Tala A.',  colors:['#4a1a2e','#2d0e1c'] },
    { num:'P-003', name:'Health Monitor App',       category:'Mobile',        members:'Reem S. · Khalid N. · Dana B.',    colors:['#1a4a3a','#0d2e24'] },
    { num:'P-004', name:'Blockchain Tracker',       category:'Security',      members:'Omar T. · Hana J. · Faris L.',     colors:['#3a2a0e','#241a08'] },
    { num:'P-005', name:'AR Campus Navigation',     category:'Mobile',        members:'Sana W. · Ziad Q. · Maya C.',      colors:['#2a1a4a','#1a0d30'] },
    { num:'P-006', name:'Automated Grading',        category:'AI Systems',    members:'Nour P. · Sami G. · Leen H.',      colors:['#1a2a4a','#0d1a30'] },
    { num:'P-007', name:'IoT Smart Home',           category:'IoT',           members:'Karim D. · Rania M. · Basil F.',   colors:['#3a1a1a','#240e0e'] },
    { num:'P-008', name:'Mental Health Chatbot',    category:'AI Systems',    members:'Dima S. · Hamza R. · Sura T.',     colors:['#1a3a2a','#0d2418'] },
  ];

  // ── BUILD CAROUSEL ──
  const track = document.getElementById('carousel-track');
  const doubled = [...projects, ...projects]; // loop
  track.innerHTML = doubled.map(p => `
    <div class="proj-card">
      <div class="proj-card-bg" style="background: linear-gradient(135deg, ${p.colors[0]} 0%, ${p.colors[1]} 100%);">
        <!-- shimmer lines as texture -->
        <svg style="position:absolute;inset:0;width:100%;height:100%;opacity:.15" preserveAspectRatio="none" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
          <path d="M-50 150 Q200 50 450 200" stroke="white" stroke-width="60" fill="none" opacity=".3"/>
          <path d="M-50 300 Q200 180 450 350" stroke="white" stroke-width="40" fill="none" opacity=".2"/>
          <path d="M-50 450 Q200 300 450 480" stroke="white" stroke-width="80" fill="none" opacity=".15"/>
        </svg>
      </div>
      <div class="proj-card-overlay"></div>
      <div class="proj-card-content">
        <div class="proj-card-tag">${p.category}</div>
        <div class="proj-card-num">${p.num}</div>
        <div class="proj-card-name">${p.name}</div>
        <div class="proj-card-members">${p.members}</div>
      </div>
    </div>
  `).join('');

  // ── DRAG TO SCROLL ──
  const wrap = document.getElementById('carousel-wrap');
  let isDragging = false, startX = 0, scrollLeft = 0, velocity = 0, lastX = 0, lastTime = 0, animId = null;

  function getScrollMax() {
    const totalW = track.scrollWidth / 2; // half because doubled
    return totalW;
  }

  let offset = 0;

  function applyOffset() {
    // seamless loop
    const half = track.scrollWidth / 2;
    if (offset >= half) offset -= half;
    if (offset < 0) offset += half;
    track.style.transform = `translateX(${-offset}px)`;
  }

  // auto scroll
  let autoSpeed = 0.6;
  function autoScroll() {
    if (!isDragging) {
      offset += autoSpeed;
      applyOffset();
    }
    requestAnimationFrame(autoScroll);
  }
  autoScroll();

  // pointer events
  wrap.addEventListener('pointerdown', e => {
    isDragging = true;
    startX = e.clientX;
    lastX = e.clientX;
    lastTime = Date.now();
    velocity = 0;
    wrap.classList.add('grabbing');
    wrap.setPointerCapture(e.pointerId);
  });

  wrap.addEventListener('pointermove', e => {
    if (!isDragging) return;
    const dx = lastX - e.clientX;
    offset += dx;
    applyOffset();
    const now = Date.now();
    velocity = dx / Math.max(1, now - lastTime) * 16;
    lastX = e.clientX;
    lastTime = now;
  });

  wrap.addEventListener('pointerup', () => {
    isDragging = false;
    wrap.classList.remove('grabbing');
    // momentum
    function momentum() {
      if (Math.abs(velocity) < 0.1) return;
      offset += velocity;
      velocity *= 0.95;
      applyOffset();
      requestAnimationFrame(momentum);
    }
    momentum();
  });

  // touch
  wrap.addEventListener('touchstart', e => { startX = e.touches[0].clientX; lastX = startX; isDragging = true; }, { passive: true });
  wrap.addEventListener('touchmove', e => {
    if (!isDragging) return;
    const dx = lastX - e.touches[0].clientX;
    offset += dx;
    applyOffset();
    lastX = e.touches[0].clientX;
  }, { passive: true });
  wrap.addEventListener('touchend', () => { isDragging = false; });

  // ── MARQUEE ──
  const marqueeItems = [
    { text:'Expo FITer 26', hi:true }, { text:'Best Project Award' },
    { text:'Faculty of Information Technology' }, { text:'Applied Science University' },
    { text:'Graduation Exhibition 2026', hi:true }, { text:'5 Categories' },
    { text:'ASU Jordan' }, { text:'Project Evaluation' },
  ];
  const mt = document.getElementById('marquee-track');
  const marq = [...marqueeItems, ...marqueeItems].map(i =>
    `<span class="marquee-item ${i.hi?'hi':''}"><span class="marquee-sep"></span>${i.text}</span>`
  ).join('');
  mt.innerHTML = marq;

  // ── LOGIN ──
  const users = {
    'judge_01': { pass: 'test1234', role: 'judge' },
    'judge_02': { pass: 'test1234', role: 'judge' },
    'judge_03': { pass: 'test1234', role: 'judge' },
    'admin':    { pass: 'admin1234', role: 'admin' },
    'prof':     { pass: 'prof1234', role: 'admin' },
  };

  function handleLogin() {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    const err = document.getElementById('error-msg');
    err.classList.remove('visible');
    if (!u || !p) { err.textContent = 'Please enter your username and password.'; err.classList.add('visible'); return; }
    const user = users[u];
    if (user && user.pass === p) {
      window.location.href = user.role === 'admin' ? 'admin.html' : 'projects.html';
    } else {
      err.classList.add('visible');
    }
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
</script>
</body>
</html>
