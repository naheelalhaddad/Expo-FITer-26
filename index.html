<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Expo FITers GP – Gateway</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,700;1,900&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .login-wrapper { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 20; padding: 1rem; }
    .login-box { background: rgba(10,6,8,0.8); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 16px; padding: 3rem; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 1.5rem; }
    .login-logo { height: 70px; object-fit: contain; mix-blend-mode: screen; margin-bottom: 1rem; align-self: center; }
    .input-field { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 8px; padding: 14px 18px; color: #fff; font-family: 'Inter', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; }
    .input-field:focus { border-color: var(--maroon); }
    .error-text { color: var(--red); font-size: 13px; text-align: center; min-height: 15px; font-weight: 500; }
  </style>
</head>
<body>

<video class="bg-video" autoplay loop muted playsinline>
  <source src="background.mp4" type="video/mp4" />
</video>
<div class="bg-layer"></div>
<div class="grid-overlay"></div>

<div class="login-wrapper">
  <form class="login-box" id="login-form">
    <img src="ExpoFITers_WhiteLogo.jpg" alt="Expo FITers" class="login-logo" />
    <input type="email" id="email" class="input-field" placeholder="Judge Email Address" required />
    <input type="password" id="password" class="input-field" placeholder="Access Key" required />
    <div id="error-msg" class="error-text"></div>
    <button type="submit" class="btn-submit" id="login-btn">Secure Login</button>
  </form>
</div>

<script src="auth.js"></script>
</body>
</html>
