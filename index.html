<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Expo FITers GP – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,700;1,900&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --maroon:     #6b1a2a;
      --maroon-mid: #4a1020;
      --red:        #c31e2d;
      --bg:         #0a0608;
      --border:     rgba(255,255,255,.08);
      --text:       #ffffff;
      --sub:        rgba(255,255,255,.45);
      --muted:      rgba(255,255,255,.2);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    /* ── BACKGROUND VIDEO ENGINE ── */
    .bg-video { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 0; filter: blur(10px); opacity: 0.65; pointer-events: none; transform: scale(1.05); }
    .bg-layer { position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse 80% 60% at 20% 50%, rgba(107,26,42,.35) 0%, transparent 60%), radial-gradient(ellipse 60% 50% at 80% 60%, rgba(195,30,45,.15) 0%, transparent 60%); pointer-events: none; }
    .grid-overlay { position: fixed; inset: 0; z-index: 1; background-image: linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px), linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px); background-size: 56px 56px; pointer-events: none; }
    .noise { position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: .04; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E"); }

    /* ── LAYOUT ── */
    .page { position: relative; z-index: 10; height: 100vh; display: flex; flex-direction: column; }

    /* ── CENTER LOGO ── */
    .hero-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    
    .brand-pill {
      background: #ffffff;
      padding: 1.5rem 3rem;
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.1);
      animation: float-in 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes float-in { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    
    .brand-pill img {
      width: 100%;
      max-width: 320px;
      height: auto;
      display: block;
    }

    /* ── BOTTOM LOGIN BOX ── */
    .login-wrapper {
      width: 100%;
      padding: 0 1.5rem 3rem 1.5rem;
      display: flex;
      justify-content: center;
    }

    .modal {
      width: 100%; max-width: 400px;
      background: rgba(10,6,8,.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.04);
      animation: slide-up .6s cubic-bezier(.22,1,.36,1) .2s both;
    }
    @keyframes slide-up { from { opacity:0; transform: translateY(40px); } to { opacity:1; transform: translateY(0); } }

    .modal-stripe { height: 4px; background: linear-gradient(90deg, var(--maroon) 0%, var(--red) 100%); }
    .modal-inner { padding: 2rem 2rem 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; }

    .modal-header {}
    .modal-eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
      color: rgba(255,255,255,.4);
      margin-bottom: 6px;
    }
    .modal-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2.2rem; font-weight: 900; letter-spacing: .04em; text-transform: uppercase;
      color: #fff; line-height: 1;
    }
    .modal-sub { font-size: 13px; color: var(--sub); margin-top: 6px; line-height: 1.5; }

    .divider { height: 1px; background: rgba(255,255,255,.08); }

    .form { display: flex; flex-direction: column; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted);
    }
    input {
      height: 48px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      padding: 0 16px;
      font-size: 15px; font-family: 'Inter', sans-serif;
      color: #fff; outline: none;
      transition: border-color .15s, background .15s, box-shadow .15s;
    }
    input:focus {
      border-color: var(--maroon);
      background: rgba(107,26,42,.1);
      box-shadow: 0 0 0 3px rgba(107,26,42,.3);
    }
    input::placeholder { color: rgba(255,255,255,.2); }

    .btn {
      height: 52px; border: none; border-radius: 10px;
      background: var(--maroon);
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all .2s;
      box-shadow: 0 4px 20px rgba(107,26,42,.5);
      margin-top: 8px;
    }
    .btn:hover { background: var(--maroon-mid); box-shadow: 0 8px 28px rgba(107,26,42,.65); transform: translateY(-2px); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .error-msg {
      font-size: 12px; color: #ffb3b8;
      background: rgba(195,30,45,.15); border: 1px solid rgba(195,30,45,.3);
      border-radius: 6px; padding: 10px 14px;
      display: none;
    }
    .error-msg.visible { display: block; }

    /* ── MARQUEE ── */
    .marquee-wrap {
      flex-shrink: 0; border-top: 1px solid var(--border); overflow: hidden; height: 36px; display: flex; align-items: center; background: rgba(10,6,8,0.6); backdrop-filter: blur(4px);
    }
    .marquee-track { display: flex; white-space: nowrap; animation: marquee 20s linear infinite; width: max-content; }
    .marquee-item { display: inline-flex; align-items: center; gap: 14px; padding: 0 28px; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .marquee-sep { width: 4px; height: 4px; border-radius: 50%; background: var(--maroon); flex-shrink: 0; }
    .marquee-item.hi { color: rgba(255,255,255,.6); }
    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    @media (max-width: 500px) {
      .brand-pill { padding: 1.25rem 2rem; }
      .brand-pill img { max-width: 240px; }
      .login-wrapper { padding: 0 1rem 2rem 1rem; }
      .modal-inner { padding: 1.5rem; }
    }
    @media (max-height: 700px) {
      .brand-pill { padding: 1rem 2rem; }
      .brand-pill img { max-width: 200px; }
      .login-wrapper { padding-bottom: 1rem; }
    }
  </style>
</head>
<body>

<video id="bg-video-stream" class="bg-video" autoplay loop muted playsinline>
  <source src="background.mp4" type="video/mp4" />
</video>
<div class="bg-layer"></div>
<div class="grid-overlay"></div>
<div class="noise"></div>

<div class="page">
  <div class="hero-container">
    <div class="brand-pill">
      <img src="Expo_FITers_GP.svg" alt="Expo FITers GP" />
    </div>
  </div>

  <div class="login-wrapper">
    <div class="modal">
      <div class="modal-stripe"></div>
      <div class="modal-inner">
        <div class="modal-header">
          <div class="modal-eyebrow">Authentication Required</div>
          <div class="modal-title">System Access</div>
          <div class="modal-sub">Enter your authorized evaluator credentials to continue.</div>
        </div>

        <div class="divider"></div>

        <form class="form" id="login-form">
          <div class="field">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="judge@asu.edu.jo" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
          </div>

          <div class="error-msg" id="error-msg">Authentication failed.</div>

          <button type="submit" class="btn" id="submit-btn">
            Authenticate
            <svg width="18" height="18" viewBox="0 0 16 16" fill="none">
              <path d="M3 8h10M9 5l4 3-4 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
      </div>
    </div>
  </div>

  <div class="marquee-wrap">
    <div class="marquee-track" id="marquee-track"></div>
  </div>
</div>

<script>
  // ==========================================
  // SUPABASE CONFIGURATION
  // ==========================================
  const supabaseUrl = 'https://bpddzqbuqdmvubuzerem.supabase.co';
  const supabaseAnonKey = 'sb_publishable_76CrGMLLkhNRoTaJy1xEWg_kbp5DSxm';
  const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

  // Background Video Speed Adjustment
  window.addEventListener('DOMContentLoaded', () => {
    const video = document.getElementById('bg-video-stream');
    if (video) { video.playbackRate = 0.5; }
  });

  // Session Verification (Skip Login if already authenticated)
  window.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      window.location.replace('projects.html');
    }
  });

  // Authentication Execution
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const err = document.getElementById('error-msg');
    const btn = document.getElementById('submit-btn');

    err.classList.remove('visible');
    btn.textContent = 'Verifying...';
    btn.disabled = true;

    const { data, error } = await supabase.auth.signInWithPassword({
      email: email,
      password: password,
    });

    if (error) {
      err.textContent = "Error: " + error.message;
      err.classList.add('visible');
      btn.innerHTML = `Authenticate <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 5l4 3-4 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      btn.disabled = false;
    } else {
      // Routing logic (Checks domain prefix for admin rights)
      if(email.includes('admin')) {
         window.location.replace('admin.html');
      } else {
         window.location.replace('projects.html');
      }
    }
  });

  // Marquee Configuration
  const marqueeItems = [
    { text:'Expo FITers GP', hi:true },
    { text:'Live Project Evaluations' },
    { text:'Applied Science University' },
    { text:'Graduation Exhibition 2026', hi:true }
  ];
  const mt = document.getElementById('marquee-track');
  const marq = [...marqueeItems, ...marqueeItems, ...marqueeItems].map(i =>
    `<span class="marquee-item ${i.hi?'hi':''}"><span class="marquee-sep"></span>${i.text}</span>`
  ).join('');
  mt.innerHTML = marq;
</script>
</body>
</html>
